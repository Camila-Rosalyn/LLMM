<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alta de Producto</title>
    <link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logoZara.svg" alt="ZARA" id="logo"> </div>
        
        <nav class="main-nav">
            <div class="banner-rebajas">
                <h1>REBAJAS</h1> </div>
            <ul>
                <li><a href="#">Nuevo Producto</a></li> <li><a href="#">Modificar Producto</a></li> <li><a href="#">Eliminar Producto</a></li> </ul>
        </nav>
    </header>

    <main>
        <section class="video-sidebar">
            <video autoplay loop muted playsinline>
                <source src="video_vertical.mp4" type="video/mp4">
                <source src="video_vertical.webm" type="video/webm">
            </video>
        </section>

        <section class="form-container">
            <form action="confirmacion.html" method="GET"> <fieldset>
                    <legend>Nuevo Producto</legend>

                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria" required>
                            <option value="vestido-mono">Vestido/Mono</option>
                            <option value="blazer">Blazer</option>
                            <option value="abrigo">Abrigo</option>
                            <option value="pantalon">Pantalón</option>
                            <option value="falda">Falda</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="codigo">Código de producto</label>
                        <input type="text" id="codigo" name="codigo" required 
                               pattern="[A-Za-z]{3}[0-9]{5}([-:][b-tB-T])?"> 
                    </div>

                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" maxlength="15">
                    </div>

                    <div class="form-group">
                        <label for="estilo">Estilo</label>
                        <input type="text" id="estilo" name="estilo" list="estilos-sugeridos" required>
                        <datalist id="estilos-sugeridos">
                            <option value="casual">
                            <option value="sporty">
                            <option value="clásico">
                            <option value="boho">
                        </datalist>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio</label>
                        <input type="number" id="precio" name="precio" step="0.01" max="999.99" required>
                    </div>

                    <div class="form-group">
                        <label for="color">Color</label>
                        <input type="color" id="color" name="color">
                    </div>

                    <div class="form-group">
                        <label for="foto">Foto</label>
                        <input type="file" id="foto" name="foto" required>
                    </div>

                    <button type="submit">Dar de Alta</button> </fieldset>
            </form>

            <div class="video-bottom">
                <video autoplay loop muted playsinline width="100%">
                    <source src="video_horizontal.mp4" type="video/mp4">
                </video>
            </div>
        </section>
    </main>

    <footer>
        <p>Póngase en contacto con nosotros en la dirección <a href="mailto:atencionTienda@inditex.es">atencionTienda@inditex.es</a></p>
    </footer>

</body>
</html>
